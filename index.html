<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>我的作品集 | Showcase</title>

    <!-- ========== 加载所有字体（支持实时切换） ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter + Noto Sans SC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- LXGW WenKai 霞鹜文楷 -->
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <!-- Preload Critical Assets -->
    <link rel="preload" as="image" href="./images/bg.webp">
    <!-- Prefetch 非首屏背景（低优先级，不阻塞首屏） -->
    <link rel="prefetch" as="image" href="./images/bg2.webp">
    <link rel="prefetch" as="image" href="./images/bg3.webp">
    <!-- ================================================== -->

    <!-- Font Awesome（异步加载，不阻塞首屏渲染） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <style>
      /* Force full screen height for the app container */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0a0a0c;
      }
      @supports (height: 100dvh) {
        html, body, #root { height: 100dvh; }
      }
      
      /* Hide Scrollbar but allow functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Smooth fade transition */
      .fade-enter {
        opacity: 0;
        transform: scale(0.98);
      }
      .fade-enter-active {
        opacity: 1;
        transform: scale(1);
        transition: opacity 300ms, transform 300ms;
      }
      /* glass-panel is now in /styles/glass.css with enhanced liquid glass effect */
    </style>
</head>
  <body class="bg-app-bg text-white antialiased overflow-hidden selection:bg-accent-blue selection:text-white">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
