<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />

    <title>我的作品集 | Showcase</title>

    <!-- ========== 加载所有字体（支持实时切换） ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter + Noto Sans SC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- LXGW WenKai 霞鹜文楷 -->
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <!-- ================================================== -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '"Noto Sans SC"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            colors: {
              'app-bg': '#000000',
              'sidebar-bg': '#1c1c1e',
              'card-bg': '#2c2c2e',
              'accent-blue': '#0a84ff',
            }
          }
        }
      }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Liquid Glass Effects -->
    <link rel="stylesheet" href="./styles/glass.css">
    <style>
      /* Hide Scrollbar but allow functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Smooth fade transition */
      .fade-enter {
        opacity: 0;
        transform: scale(0.98);
      }
      .fade-enter-active {
        opacity: 1;
        transform: scale(1);
        transition: opacity 300ms, transform 300ms;
      }
      /* glass-panel is now in /styles/glass.css with enhanced liquid glass effect */
    </style>
